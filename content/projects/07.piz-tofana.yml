icon:
  name: "sf-symbols:shield.lefthalf.filled"
eyebrow: "Security Journey"
title: "Piz Tofana Tooling Team"
description: >-
  Während meines Aufenthalts im Team Piz Tofana, habe ich hauptsächlich an
  der Daedalus Applikation gearbeitet. Diese bietet verschiedene
  Selbstbeurteilungs-Module, die von den Fachabteilungen zur Bewertung von
  Datenschutz, Sicherheit, Compliance, Klassifizierung und Weiterem für
  verknüpfte Objekte wie Anwendungen, Ressourcen, Dienste oder Angebote
  bereitgestellt werden. Als Technologien wurden Java Spring Boot für das
  Backend und Angular für das Frontend verwendet.
