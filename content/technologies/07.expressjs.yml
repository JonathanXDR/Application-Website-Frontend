icon:
  name: "simple-icons:express"
  background: "var(--color-card-logo-secondary)"
  colors:
    primary: "var(--color-card-logo-primary)"
    secondary: "var(--color-card-logo-secondary)"
    tertiary: "var(--color-card-logo-tertiary)"
eyebrow: "Framework"
title: "Express.js"
description: >-
  Meine CRUD-App im NexCC habe ich damit erstellt, was sehr lehrreich für
  mich war. Später hatte ich auch noch einen entsprechenden ÜK, welcher darum
  ging ein Backend mit Express.js zu erstellen.
badges:
  - title: "Web"
  - title: "Backend"
  - title: "Node"
    icon:
      name: "simple-icons:nodedotjs"
links:
  - title: "Mehr erfahren"
    url: "https://expressjs.com"
    icon:
      name: "sf-symbols:chevron.right"

i18n:
  en:
    description: >-
      I used it to create my CRUD app in NexCC, which was very instructive
      for me. Later, I also had a corresponding training course, which was
      about creating a backend with Express.js.
    links:
      - title: "Learn more"
  fr:
    description: >-
      J'ai créé mon application CRUD dans NexCC, ce qui a été très instructif
      pour moi. Plus tard, j'ai également suivi un cours de formation
      correspondant, qui consistait à créer un backend avec Express.js.
    links:
      - title: "En savoir plus"
  it:
    description: >-
      L'ho utilizzato per creare la mia applicazione CRUD in NexCC, che è
      stata molto istruttiva per me. In seguito, ho seguito anche un corso di
      formazione corrispondente, che riguardava la creazione di un backend
      con Express.js.
    links:
      - title: "Per saperne di più"
