  colors:
    primary: "#DC322F"
    secondary: "#DC322F"
    tertiary: "#DC322F"
eyebrow: "Sprache"
title: "Scala"
description: >-
  Scala habe ich im Berufsschulmodul 323 kennengelernt und fand es sehr
