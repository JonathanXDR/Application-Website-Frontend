  fr:
    description: >-
      Comme alternative à Prisma, j'ai également mis en oeuvre mon
      application CRUD, après l'avoir terminée, avec TypeORM, car cet ORM
      est également utilisé dans divers projets de le Apps Team.
    links:
      - title: "En savoir plus"
  it:
    description: >-
      In alternativa a Prisma, ho anche implementato la mia applicazione CRUD
      con TypeORM dopo averla terminata, dato che questo ORM è utilizzato
      anche in diversi progetti del Apps Team.
    links:
      - title: "Per saperne di più"
