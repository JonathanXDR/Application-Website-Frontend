description: >-
  Entdecke meinen Weg als Softwareentwickler, mit Projekten, Fähigkeiten und
  meiner Leidenschaft für effiziente, benutzerorientierte Lösungen in der
  Webentwicklung.

pages:
  technologies:
    description: >-
      Entdecke die Technologien, Frameworks und Werkzeuge, mit denen ich
      arbeite, von der Frontend-Entwicklung bis zu Backend-Systemen.
  projects:
    description: >-
      Durchstöbere meine beruflichen und persönlichen Projekte,
      von Unternehmensanwendungen bei Swisscom bis hin zu Open-Source-Beiträgen.
  music:
    description: >-
      Entdecke meine Musikwelt mit aktuellen Favoriten, Playlists und
      allem, was mich musikalisch inspiriert.

