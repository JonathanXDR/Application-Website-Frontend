eyebrow: "Full-Stack"
title: "Apps Team (IPA)"
description: >-
  Für meine IPA (Individuelle Praktische Arbeit) habe ich mich entschieden,
  nochmals ins Apps Team zu gehen, da ich dort bereits viele Erfahrungen
  sammeln konnte und mich das Team, sowie dessen Zusammenhalt wirklich
  begeistert hat. Von Anfang an durfte ich bereits an produktiven Projekten
  mitarbeiten, wie z.B. dem Trade Compliance Tool oder den Enterprise Connect
  Demos. Bei beiden Tools verwenden wir hauptsächlich mit Next.js und
  Nest.js, inklusive Prisma als ORM.
