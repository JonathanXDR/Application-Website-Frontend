      fonctionnalité FAQ.
    links:
      - title: "En savoir plus sur l'Apps Team"
      - title: "En savoir plus sur indigo online"
    info:
      date:
        duration:
          to: "2025-08-01"
  it:
    description: >-
      Per il mio IPA (Lavoro Pratico Individuale) ho nuovamente scelto il
      team Apps, poiché avevo già accumulato esperienze variegate lì e sia il
      team che la sua forte coesione mi hanno colpito profondamente. Fin
      dall'inizio, ho potuto partecipare a progetti produttivi, tra cui il
      Trade Compliance Tool e le Enterprise Connect Demos. Entrambe le
