i18n:
  en:
    description: >-
      For my IPA (Individual Practical Project), I chose to go back to the
      Apps Team, because I had already gained a lot of experience there and
      the team and how well everyone sticks together really inspired me. From the
      very beginning, I got to work on productive projects such as the Trade
      Compliance Tool and the Enterprise Connect Demos. For both tools we
      mainly work with Next.js and Nest.js, including Prisma as the ORM. As
      part of my IPA, I also worked on the Trade Compliance application and
      implemented an FAQ feature, with a dedicated FAQ section and an admin
      interface for managing the entries.
    links:
      - title: "Learn more about the Apps Team"
      - title: "Learn more about Indigo online"
    info:
      date:
        duration:
          to: "2025-08-01"
  fr:
    description: >-
      Pour mon IPA (Travail Pratique Individuel), j'ai de nouveau choisi
      l'Apps Team, car j'y avais déjà accumulé beaucoup d'expérience et que
      l'équipe ainsi que sa cohésion m'ont vraiment enthousiasmé. Dès le début, j'ai pu
      participer à des projets productifs, dont le Trade Compliance Tool et
      les Enterprise Connect Demos. Pour ces deux outils, nous travaillons
      principalement avec Next.js et Nest.js, avec Prisma comme ORM. Dans le
