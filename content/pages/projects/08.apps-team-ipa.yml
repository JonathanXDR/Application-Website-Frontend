  it:
    description: >-
      Per il mio IPA (Lavoro Pratico Individuale) ho scelto di tornare
      nell'Apps Team, perché lì avevo già raccolto molta esperienza e perché
      il team e la sua coesione mi hanno davvero entusiasmato. Fin
