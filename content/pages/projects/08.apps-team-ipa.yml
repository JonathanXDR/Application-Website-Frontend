icon:
  name: "sf-symbols:airplane.arrival"
eyebrow: "Full-Stack"
title: "Apps Team (IPA)"
description: >-
  Für meine IPA (Individuelle Praktische Arbeit) habe ich mich entschieden,
  nochmals ins Apps Team zu gehen, da ich dort bereits viele Erfahrungen
  sammeln konnte und mich das Team sowie dessen Zusammenhalt wirklich
  begeistert haben. Von Anfang an durfte ich an produktiven Projekten
  mitarbeiten, zum Beispiel am Trade Compliance Tool oder den Enterprise
  Connect Demos. Bei beiden Tools arbeiten wir hauptsächlich mit Next.js und
  Nest.js, inklusive Prisma als ORM. Im Rahmen meiner IPA habe ich ebenfalls
  an der Trade Compliance Applikation gearbeitet und ein FAQ-Feature
  umgesetzt, mit einem eigenen FAQ-Bereich und einer Admin-Oberfläche zum
  Verwalten der Einträge.
