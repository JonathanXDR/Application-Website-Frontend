i18n:
  en:
    description: >-
      For my IPA (Individual Practical Project), I once again chose the Apps
      Team, as I had already gained diverse experience there and was deeply
      impressed by both the team and its strong cohesion. From the very
      beginning, I was able to participate in productive projects, including
      the Trade Compliance Tool and the Enterprise Connect Demos. Both
      applications are primarily based on Next.js and Nest.js, with Prisma
      used as the ORM. As part of my IPA, I also worked on the Trade
      Compliance application and implemented an FAQ feature, which includes a
      dedicated FAQ section as well as an admin interface for managing
      entries.
    links:
      - title: "Learn more about the Apps Team"
      - title: "Learn more about indigo online"
    info:
      date:
        duration:
          to: "2025-08-01"
  fr:
    description: >-
      Pour mon IPA (Travail Pratique Individuel), j'ai de nouveau choisi le
      Apps Team, car j'y avais déjà accumulé des expériences variées et
      j'étais profondément impressionné par l'équipe et sa forte cohésion.
      Dès le début, j'ai pu participer à des projets productifs, dont le
      Trade Compliance Tool et les Enterprise Connect Demos. Les deux
      applications sont principalement basées sur Next.js et Nest.js, avec
      Prisma utilisé comme ORM. Dans le cadre de mon IPA, j'ai également
