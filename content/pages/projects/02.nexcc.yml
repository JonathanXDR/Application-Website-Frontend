title: "Competence Center NexCC"
description: >-
  Im NexCC durfte ich zuerst diese Webseite hier erstellen und habe dabei
  viele neue Programmiersprachen gelernt, darunter HTML, CSS und JavaScript.
  Danach habe ich eine CRUD-App gebaut und sie mit einer SQL-Datenbank
  verbunden. Später kam noch ein Frontend dazu, womit ich ein eigenes
  Login-System erstellt habe. Dabei habe ich vor allem das Backend
  kennengelernt und mit Express.js und Vue.js zum ersten Mal mit Frameworks
  gearbeitet.
