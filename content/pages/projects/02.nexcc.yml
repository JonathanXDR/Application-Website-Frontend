i18n:
  en:
    description: >-
      At NexCC, I first had the opportunity to create this website and
      learned many new programming languages, including HTML, CSS, and
      JavaScript. Afterwards, I developed a CRUD app which I connected to a
      SQL database. Later, I also added a frontend and created my own login
      system. In the process, I particularly got to know backend development
      and learned new framework-based programming languages such as
      Express.js and Vue.js.
  fr:
    description: >-
      Au NexCC, j'ai d'abord eu l'opportunité de créer ce site web et j'ai
      appris de nombreux nouveaux langages de programmation, dont HTML, CSS
      et JavaScript. Ensuite, j'ai développé une application CRUD que j'ai
      connectée à une base de données SQL. Plus tard, j'ai également ajouté
      un frontend et créé mon propre système de connexion. Dans ce processus,
      j'ai surtout appris le développement backend et de nouveaux langages
      basés sur des frameworks comme Express.js et Vue.js.
  it:
    description: >-
      Al NexCC, ho avuto l'opportunità di creare questo sito web e ho
      imparato molti nuovi linguaggi di programmazione, tra cui HTML, CSS e
      JavaScript. Successivamente, ho sviluppato un'app CRUD che ho collegato
      a un database SQL. In seguito, ho aggiunto anche un frontend e creato
      il mio sistema di login. In questo modo, ho approfondito le mie
      conoscenze nel backend e ho appreso nuovi linguaggi di programmazione
      basati su framework come Express.js e Vue.js.
