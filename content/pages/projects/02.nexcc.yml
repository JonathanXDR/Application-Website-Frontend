title: "Competence Center NexCC"
description: >-
  Im NexCC durfte ich zuerst diese Webseite hier erstellen und habe dabei
  viele neue Programmiersprachen gelernt. Darunter HTML, CSS und JavaScript.
  Danach durfte ich dann eine CRUD-App erstellen, welche ich mit einer
  SQL-Datenbank verbunden habe. Später habe ich auch noch ein Frontend
  hinzugefügt und so ein eigenes Login-System erstellt. Dabei habe ich vor
  allem das Backend kennengelernt und Framework basierte
  Programmiersprachen, wie Express.js oder Vue.js neu dazugelernt.
