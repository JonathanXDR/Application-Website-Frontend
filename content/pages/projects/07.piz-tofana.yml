i18n:
  en:
    description: >-
      During my time in the Piz Tofana team, I mainly worked on the Daedalus
      application. It offers various self-assessment modules that the
      specialist departments provide to evaluate data protection, security,
      compliance, classification, and more for linked objects such as
      applications, resources, services, or offers. The technologies used were
      Java Spring Boot for the backend and Angular for the frontend.
  fr:
    description: >-
      Pendant mon passage dans l'équipe Piz Tofana, j'ai principalement
      travaillé sur l'application Daedalus. Elle propose différents modules
      d'auto-évaluation mis à disposition par les services spécialisés pour
      évaluer la protection des données, la sécurité, la conformité, la
      classification et plus encore pour des objets liés tels que des
      applications, des ressources, des services ou des offres. Les
      technologies utilisées étaient Java Spring Boot pour le backend et
      Angular pour le frontend.
  it:
    description: >-
      Durante il mio periodo nel team Piz Tofana ho lavorato principalmente
      sull'applicazione Daedalus. Offre vari moduli di autovalutazione messi a
      disposizione dai reparti specializzati per valutare la protezione dei
      dati, la sicurezza, la conformità, la classificazione e altro ancora per
      oggetti collegati come applicazioni, risorse, servizi o offerte. Le
      tecnologie utilizzate sono state Java Spring Boot per il backend e
      Angular per il frontend.
