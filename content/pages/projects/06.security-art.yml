icon:
  name: "sf-symbols:shield.lefthalf.filled"
eyebrow: "Security Journey"
title: "Security & Compliance Services ART"
description: >-
  In diesem Projekt habe ich mit ein paar Trainings zu Cloud, Security und
  DevOps begonnen, die ziemlich lehrreich für mich waren. Danach durfte ich
  am DAM Log Scanner Projekt mitarbeiten, einem Tool, das
  Datenbankaktivitäten aufzeichnet (Database Activity Monitoring) und nach
  bestimmten Richtlinien handelt. Diese wurden vor allem mit OPA (Open Policy
  Agent) umgesetzt, womit ich allerdings wenig zu tun hatte. Ich habe
  hauptsächlich Python, Docker und Kubernetes verwendet, wobei Python für mich
  neu war. Gegen Ende des Projekts habe ich zusätzlich begonnen, Elasticsearch
  zu implementieren, um die Daten zu visualisieren und zu analysieren.
