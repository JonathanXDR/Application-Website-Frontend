i18n:
  en:
    description: >-
      In this project, I began with several trainings on Cloud, Security, and
      DevOps, which were very instructive for me. Afterwards, I had the
      opportunity to work on the DAM Log Scanner project, a tool that records
      database activities (Database Activity Monitoring) and acts according
      to specific guidelines. These were primarily implemented using OPA
      (Open Policy Agent), although I didn't work much with it. I mainly used
      Python, Docker, and Kubernetes, with Python being new to me. Towards
      the end of the project, I also started implementing Elasticsearch to
      visualize and analyse the data.
    info:
      department: "INI-EOG-EA-EAF"
  fr:
    description: >-
      Dans ce projet, j'ai commencé avec plusieurs formations sur le Cloud,
      la Sécurité et le DevOps, qui ont été très instructives. Ensuite, j'ai
      eu l'opportunité de travailler sur le projet DAM Log Scanner, un outil
      qui enregistre les activités de la base de données et agit selon des
      directives spécifiques. Celles-ci ont été principalement mises en
      oeuvre avec OPA. J'ai principalement utilisé Python, Docker et
      Kubernetes, Python étant nouveau pour moi. Vers la fin du projet, j'ai
      aussi commencé à implémenter Elasticsearch pour visualiser et analyser
      les données.
    info:
      department: "INI-EOG-EA-EAF"
  it:
    description: >-
      In questo progetto ho iniziato con alcuni corsi di formazione su Cloud,
      Sicurezza e DevOps, che sono stati molto istruttivi per me.
      Successivamente, ho avuto l'opportunità di lavorare sul progetto DAM
      Log Scanner, uno strumento che registra le attività del database
      (Database Activity Monitoring) e agisce secondo linee guida specifiche.
      Queste sono state principalmente implementate con OPA (Open Policy
      Agent), anche se non ne ho fatto molto uso. Ho principalmente
      utilizzato Python, Docker e Kubernetes, con Python che era nuovo per
      me. Verso la fine del progetto, ho anche iniziato a implementare
      Elasticsearch per visualizzare e analizzare i dati.
    info:
      department: "INI-EOG-EA-EAF"
