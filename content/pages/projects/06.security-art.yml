i18n:
  en:
    description: >-
      In this project, I started with a few training courses on Cloud,
      Security, and DevOps, which taught me a lot. After that, I got to work
      on the DAM Log Scanner project, a tool that records database activities
      (Database Activity Monitoring) and acts according to certain guidelines.
      These were mainly implemented with OPA (Open Policy Agent), which I did
      not work with much. I mainly used Python, Docker, and Kubernetes, and
      Python was new to me. Towards the end of the project, I also started
      implementing Elasticsearch to visualize and analyze the data.
  fr:
    description: >-
      Dans ce projet, j'ai commencé par quelques formations sur le Cloud, la
      sécurité et le DevOps, qui ont été très instructives. Ensuite, j'ai pu
      travailler sur le projet DAM Log Scanner, un outil qui enregistre les
      activités des bases de données (Database Activity Monitoring) et agit
      selon certaines directives. Celles-ci ont été mises en place surtout
      avec OPA (Open Policy Agent), avec lequel je n'ai toutefois pas beaucoup
      travaillé. J'ai principalement utilisé Python, Docker et Kubernetes,
      Python étant nouveau pour moi. Vers la fin du projet, j'ai aussi commencé
      à implémenter Elasticsearch pour visualiser et analyser les données.
  it:
    description: >-
      In questo progetto ho iniziato con alcuni corsi di formazione su Cloud,
      Sicurezza e DevOps, che sono stati molto istruttivi per me. Poi ho
      potuto lavorare al progetto DAM Log Scanner, uno strumento che registra
      le attività dei database (Database Activity Monitoring) e agisce secondo
      determinate linee guida. Queste sono state implementate soprattutto con
      OPA (Open Policy Agent), con cui però ho avuto poco a che fare. Ho
      utilizzato principalmente Python, Docker e Kubernetes, e Python era nuovo
      per me. Verso la fine del progetto ho anche iniziato a implementare
      Elasticsearch per visualizzare e analizzare i dati.
