eyebrow: "Backend"
title: "Apps Team"
description: >-
  Nachdem ich bereits im Apps Team als Frontend-Entwickler tätig war, wollte
  ich nun auch das Backend besser kennenlernen. Zuerst durfte ich meine
  eigene CRUD-App erstellen. Dabei habe ich viel Neues über Nest.js und die
  beiden ORMs Prisma und TypeORM gelernt und wertvolle Erfahrungen gesammelt.
  Später habe ich für meine CRUD-App auch ein Frontend mit GitHub Primer
  erstellt. Danach habe ich beim Tool für Medienkurse mitgeholfen und konnte
  dort einige Features hinzufügen und Fehler beheben. Schliesslich durfte ich
  auch beim Fleetmanagement Tool und den neuen Webfrontends mitwirken, was
  mir sehr gefallen hat :)
