i18n:
  en:
    description: >-
      After working as a frontend developer in the Apps Team, I wanted to get
      to know the backend better too. First, I got to build my own CRUD app. I
      learned a lot about Nest.js and the two ORMs, Prisma and TypeORM, and
      gained valuable experience. Later, I also built a frontend for my CRUD
      app with GitHub Primer. After that, I helped out with the media courses
      tool, where I added a few features and fixed bugs. Finally, I got to
      contribute to the Fleetmanagement Tool and the new web frontends, which
      I really enjoyed :)
    links:
      - title: "Learn more about the Apps Team"
      - title: "Learn more about Indigo online"
  fr:
    description: >-
      Après avoir travaillé comme développeur frontend dans l'Apps Team, je
      voulais aussi mieux connaître le backend. J'ai d'abord pu créer ma propre
      application CRUD. J'ai beaucoup appris sur Nest.js et sur les deux ORM,
      Prisma et TypeORM, et j'ai acquis une expérience précieuse. Plus tard,
      j'ai aussi créé un frontend pour mon application CRUD avec GitHub Primer.
      Ensuite, j'ai contribué à l'outil pour les cours médias, où j'ai ajouté
      quelques fonctionnalités et corrigé des bugs. Enfin, j'ai aussi pu
      participer au Fleetmanagement Tool et aux nouveaux frontends web, ce que
      j'ai beaucoup apprécié :)
    links:
      - title: "En savoir plus sur l'Apps Team"
      - title: "En savoir plus sur Indigo online"
  it:
    description: >-
      Dopo aver lavorato come sviluppatore frontend nell'Apps Team, volevo
      conoscere meglio anche il backend. Prima ho potuto creare la mia app
      CRUD. Ho imparato molto su Nest.js e sui due ORM, Prisma e TypeORM, e ho
      acquisito esperienze preziose. Più tardi ho creato anche un frontend per
      la mia app CRUD con GitHub Primer. Poi ho collaborato allo strumento
      per i corsi sui media, dove ho potuto aggiungere alcune funzionalità e
      correggere errori. Infine ho potuto collaborare al Fleetmanagement Tool
      e ai nuovi frontend web, cosa che mi è piaciuta molto :)
    links:
      - title: "Maggiori informazioni sull'Apps Team"
      - title: "Maggiori informazioni su Indigo online"
