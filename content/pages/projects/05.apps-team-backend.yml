eyebrow: "Backend"
title: "Apps Team"
description: >-
  Nachdem ich bereits im Apps Team als Frontend Entwickler tätig war, wollte
  ich nun auch noch das Backend besser kennenlernen. Zuerst durfte ich meine
  eigene CRUD-App erstellen. Ich konnte viel Neues über Nest.js und die
  beiden ORMs Prisma und TypeORM lernen und habe dabei wertvolle Erfahrungen
  gesammelt. Später habe ich auch noch ein Frontend für meine CRUD-App mit
  GitHub Primer erstellt. Danach habe ich dann beim Tool für Medienkurse
  mitgeholfen und konnte dort einige Features hinzufügen und Fehler beheben.
  Schliesslich durfte ich auch beim Fleet Management Tool und den Neuen
  Webfrontends mitwirken, was mir sehr gefallen hat :)
