i18n:
  en:
    description: >-
      After having worked as a frontend developer in the Apps Team, I wanted
      to gain a deeper understanding of the backend. First, I had the
      opportunity to create my own CRUD app. I learned a lot about Nest.js
      and the two ORMs, Prisma and TypeORM, and gained valuable experience.
      Later, I also created a frontend for my CRUD app using GitHub Primer.
      Afterwards, I contributed to the media courses tool, where I added
      several features and fixed bugs. Finally, I also worked on the Fleet
      Management Tool and the new web frontends, which I really enjoyed :)
    links:
      - title: "Learn more about the Apps Team"
      - title: "Learn more about indigo online"
    info:
      department: "GHR-POD-LES-APP"
  fr:
    description: >-
      Après avoir travaillé comme développeur frontend dans le Apps Team,
      j'ai voulu approfondir mes connaissances du backend. D'abord, j'ai eu
      l'opportunité de créer ma propre application CRUD. J'ai beaucoup appris
      sur Nest.js et les deux ORM, Prisma et TypeORM, acquérant une
      expérience précieuse. Plus tard, j'ai créé un frontend pour mon
      application CRUD avec GitHub Primer. Ensuite, j'ai contribué à l'outil
      de cours multimédia, ajoutant des fonctionnalités et corrigeant des
      bugs. Enfin, j'ai aussi travaillé sur l'outil de gestion de flotte et
      les nouveaux web frontends, ce que j'ai beaucoup apprécié :)
    links:
      - title: "En savoir plus sur l'Apps Team"
      - title: "En savoir plus sur indigo online"
    info:
      department: "GHR-POD-LES-APP"
  it:
    description: >-
      Dopo aver lavorato come sviluppatore frontend nel team Apps, ho voluto
      approfondire anche il backend. Prima ho avuto l'opportunità di creare
      la mia app CRUD. Ho imparato molto su Nest.js e sui due ORM, Prisma e
      TypeORM, acquisendo esperienze preziose. Successivamente, ho anche
      creato un frontend per la mia app CRUD usando GitHub Primer. In
      seguito, ho contribuito allo strumento per i corsi multimediali,
      aggiungendo diverse funzionalità e correggendo errori. Infine, ho
      partecipato al Fleet Management Tool e ai nuovi web frontend, che mi
      sono piaciuti molto :)
    links:
      - title: "Maggiori informazioni sull'Apps Team"
      - title: "Maggiori informazioni su indigo online"
    info:
      department: "GHR-POD-LES-APP"
