eyebrow: "Hey ;)"
title: "Ich bin Jonathan"
description: >-
  Ich bin {age} Jahre alt und komme aus der Schweiz.

  Schon früh war ich von Computern begeistert, und diese Leidenschaft begleitet
  mich bis heute. Meine ersten Schritte im Programmieren machte ich mit
  Minecraft Commands und Command Blocks, was meine Faszination für die Welt der
  Softwareentwicklung geweckt hat.

  Kürzlich habe ich meine Ausbildung zum Informatiker EFZ
  Applikationsentwicklung erfolgreich abgeschlossen. Ich arbeite in einem
  Bereich, der sich ständig weiterentwickelt und immer neue Herausforderungen
  bietet. Ich finde es faszinierend, was man mit Code alles erreichen kann, von
  komplexen Anwendungen bis zu innovativen Ansätzen. Die nahezu unbegrenzten
  Möglichkeiten begeistern mich, und besonders liebe ich es, kreative Projekte
  zu realisieren und Ideen in der digitalen Welt zum Leben zu erwecken.

  Wenn ich nicht gerade programmiere, spiele ich gerne Computer- und
  Konsolenspiele oder verbringe Zeit mit meinen Freunden. Musik begleitet mich
  oft durch den Tag und ist ein wichtiger Teil meines Lebens.
birthDate: "2005-12-12"
imageAlt: "Porträt von Jonathan Russ"

i18n:
  en:
    eyebrow: "Hey ;)"
    title: "I'm Jonathan"
    imageAlt: "Portrait of Jonathan Russ"
    description: >-
      I'm {age} years old and from Switzerland.

      Computers excited me from an early age, and that passion has stayed with
      me ever since. My first steps into programming were with Minecraft
      Commands and Command Blocks, which sparked my interest in the world of
      software development.

      I recently completed my apprenticeship as an "Informatiker EFZ
      Applikationsentwicklung" (Swiss Federal Diploma in Application
      Development). I work in a field that keeps evolving and always brings new
      challenges. I find it fascinating what you can achieve with code, from
      complex applications to innovative approaches. The nearly unlimited
      possibilities excite me, and I especially love bringing creative projects
      and ideas to life in the digital world.

      When I'm not coding, I enjoy playing computer and console games or
      spending time with my friends. Music often accompanies me through the day
      and is an important part of my life.
  fr:
    eyebrow: "Hey ;)"
    title: "Je suis Jonathan"
    imageAlt: "Portrait de Jonathan Russ"
    description: >-
      J'ai {age} ans et je viens de Suisse.

      Les ordinateurs me passionnent depuis tout petit, et cette passion ne m'a
      jamais quitté. J'ai fait mes premiers pas en programmation avec les
      Minecraft Commands et les Command Blocks, ce qui a éveillé mon intérêt
      pour le monde du développement logiciel.

      J'ai récemment terminé mon apprentissage d'"Informatiker EFZ
      Applikationsentwicklung" (CFC suisse en développement d'applications).
      Je travaille dans un domaine en constante évolution, riche en défis. Je
      trouve fascinant tout ce que l'on peut accomplir avec du code, des
      applications complexes aux approches innovantes. Les possibilités quasi
      infinies m'enthousiasment, et j'aime particulièrement donner vie à des
      projets créatifs et à des idées dans le monde numérique.

      Quand je ne programme pas, j'aime jouer à des jeux sur ordinateur et
      console ou passer du temps avec mes amis. La musique m'accompagne
      souvent tout au long de la journée et occupe une place importante dans
      ma vie.
  it:
    eyebrow: "Hey ;)"
    title: "Sono Jonathan"
    imageAlt: "Ritratto di Jonathan Russ"
    description: >-
      Ho {age} anni e vengo dalla Svizzera.

      Sin da piccolo sono appassionato di computer, e questa passione mi
      accompagna ancora oggi. Ho mosso i primi passi nella programmazione con i
      Minecraft Commands e i Command Blocks, e questo ha acceso la mia
      curiosità per il mondo dello sviluppo software.

      Ho concluso da poco il mio apprendistato come "Informatiker EFZ
      Applikationsentwicklung" (diploma federale svizzero in sviluppo di
      applicazioni). Lavoro in un settore in continua evoluzione, ricco di
      sfide sempre nuove. Trovo affascinante ciò che si può ottenere con il
      codice, dalle applicazioni complesse agli approcci innovativi. Le
      possibilità quasi illimitate mi entusiasmano, e amo in particolare
      realizzare progetti creativi e dare vita alle idee nel mondo digitale.

      Quando non programmo, mi piace giocare a videogiochi per computer e
      console o passare del tempo con i miei amici. La musica mi accompagna
      spesso durante la giornata ed è una parte importante della mia vita.
