icon:
  name: "simple-icons:scala"
  background: "#DC322F"
  colors:
    primary: "#DC322F"
    secondary: "#DC322F"
    tertiary: "#DC322F"
eyebrow: "Sprache"
title: "Scala"
description: >-
  Scala habe ich im Berufsschulmodul 323 kennengelernt und fand es sehr
  interessant, weil es viele Parallelen zu Java hat, aber auch viele neue
  Konzepte mitbringt, zum Beispiel Traits oder Pattern Matching.
badges:
  - title: "Backend"
  - title: "Object-Oriented"
  - title: "Functional"
  - title: "Java"
    icon:
      name: "simple-icons-extended:java"
links:
  - title: "Mehr erfahren"
    url: "https://scala-lang.org"
    icon:
      name: "sf-symbols:chevron.right"

i18n:
  en:
    eyebrow: "Language"
    description: >-
      I got to know Scala in vocational school module 323 and found it very
      interesting, because it has a lot in common with Java but also brings
      many new concepts, for example traits or pattern matching.
    links:
      - title: "Learn more"
  fr:
    eyebrow: "Langage"
    description: >-
      J'ai découvert Scala dans le module 323 de l'école professionnelle et
      je l'ai trouvé très intéressant, car il a beaucoup de points communs
      avec Java tout en apportant de nombreux nouveaux concepts, par exemple les
      traits ou le pattern matching.
    links:
      - title: "En savoir plus"
  it:
    eyebrow: "Linguaggio"
    description: >-
      Ho conosciuto Scala nel modulo 323 della scuola professionale e l'ho
      trovato molto interessante, perché ha molti punti in comune con Java,
      ma introduce anche molti concetti nuovi, per esempio i trait o il pattern
      matching.
    links:
      - title: "Per saperne di più"
