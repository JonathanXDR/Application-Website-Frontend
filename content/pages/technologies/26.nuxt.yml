icon:
  name: "simple-icons:nuxt"
  background: "#00DC82"
  colors:
    primary: "#00DC82"
    secondary: "#00DC82"
    tertiary: "#00DC82"
eyebrow: "Framework"
title: "Nuxt"
description: >-
  Nuxt habe ich mir selbst beigebracht, weil ich es interessant fand und
  gerne mit Vue programmiere, worauf Nuxt aufbaut. Bisher habe ich es
  allerdings in keinem anderen Projekt als dieser Webseite verwendet.
badges:
  - title: "Frontend"
  - title: "Web"
  - title: "SSR"
  - title: "Vue"
    icon:
      name: "simple-icons:vuedotjs"
links:
  - title: "Mehr erfahren"
    url: "https://nuxt.com"
    icon:
      name: "sf-symbols:chevron.right"

i18n:
  en:
    description: >-
      I taught myself Nuxt because I found it interesting and because I like
      programming with Vue, which Nuxt is built on. So far, though, I haven't
      used it for any project other than this website.
    links:
      - title: "Learn more"
  fr:
    description: >-
      J'ai appris Nuxt par moi-même, parce que je le trouvais intéressant et
      que j'aime programmer avec Vue, sur lequel Nuxt est basé. Jusqu'à
      présent, je ne l'ai toutefois utilisé pour aucun projet à part ce site
      web.
    links:
      - title: "En savoir plus"
  it:
    description: >-
      Ho imparato Nuxt da solo, perché lo trovavo interessante e perché mi
      piace programmare con Vue, su cui Nuxt si basa. Finora, però, non l'ho
      usato in nessun altro progetto a parte questo sito web.
    links:
      - title: "Per saperne di più"
