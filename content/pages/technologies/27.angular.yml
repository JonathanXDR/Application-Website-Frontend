      While I was on the Piz Tofana team, I got to know Angular and also
      worked with it. We worked with it during the development of the
      Daedalus Frontend.
    links:
      - title: "Learn more"
  fr:
    description: >-
      Pendant que j'étais dans l'équipe de Piz Tofana, j'ai appris à
      connaître Angular et à l'utiliser. Nous l'avons utilisé pendant le
      développement du front-end de Daedalus.
    links:
      - title: "En savoir plus"
  it:
    description: >-
      Mentre ero nel team di Piz Tofana, ho conosciuto Angular e ci ho anche
      lavorato. Ci abbiamo lavorato durante lo sviluppo del front-end di
      Daedalus.
    links:
      - title: "Per saperne di più"
