icon:
  name: "simple-icons-extended:java"
  background: "#007396"
  colors:
    primary: "#007396"
    secondary: "#007396"
    tertiary: "#007396"
eyebrow: "Sprache"
title: "Java"
description: >-
  Java kenne ich hauptsächlich vom Berufsschulmodul 319, wo wir damit
  gearbeitet und kleinere Aufgaben programmiert haben. Im Modul 320 kam dann
  noch OOP dazu, was ich sehr interessant fand. Ausserdem habe ich den
  ÜK-223 besucht, bei dem es darum ging, Multi-User-Applikationen
  objektorientiert zu realisieren. Das haben wir mit einem Java-Backend und
  einem ORM gemacht.
badges:
  - title: "Backend"
  - title: "Object-Oriented"
  - title: "Enterprise"
links:
  - title: "Mehr erfahren"
    url: "https://java.com"
    icon:
      name: "sf-symbols:chevron.right"

i18n:
  en:
    eyebrow: "Language"
    description: >-
      I mainly know Java from the vocational school module 319, where we
      worked with it and programmed smaller tasks. Module 320 then added OOP,
      which I found very interesting. I also attended the ÜK-223, which was
      about building multi-user applications in an object-oriented way. We
      did this with a Java backend and an ORM.
    links:
      - title: "Learn more"
  fr:
    eyebrow: "Langage"
    description: >-
      Je connais Java principalement grâce au module 319 de l'école
      professionnelle, où nous avons travaillé avec et programmé de petits
      exercices. Le module 320 y a ensuite ajouté la POO, que j'ai trouvée
      très intéressante. J'ai également suivi le ÜK-223, qui portait sur la
      réalisation d'applications multi-utilisateurs orientées objet. Nous
      l'avons fait avec un backend Java et un ORM.
    links:
      - title: "En savoir plus"
  it:
    eyebrow: "Linguaggio"
    description: >-
      Conosco Java soprattutto dal modulo 319 della scuola professionale,
      dove abbiamo lavorato con esso e programmato piccoli esercizi. Il
      modulo 320 ha poi aggiunto l'OOP, che ho trovato molto interessante. Ho
      frequentato anche l'ÜK-223, che riguardava la realizzazione di
      applicazioni multiutente in modo orientato agli oggetti. Lo abbiamo
      fatto con un backend Java e un ORM.
    links:
      - title: "Per saperne di più"
