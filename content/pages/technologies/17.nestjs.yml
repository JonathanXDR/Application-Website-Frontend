icon:
  name: "simple-icons:nestjs"
  background: "#E0234E"
  colors:
    primary: "#E0234E"
    secondary: "#E0234E"
    tertiary: "#E0234E"
eyebrow: "Framework"
title: "Nest.js"
description: >-
  Dieses Backend-Framework habe ich im Apps Team kennengelernt und damit
  meine CRUD-App erstellt. Dabei habe ich viel über die Architektur und die
  verschiedenen Module gelernt. Ausserdem habe ich damit auch in produktiven
  Projekten im Apps Team gearbeitet, zum Beispiel am Fleetmanagement Tool
  oder an den neuen Webfrontends.
badges:
  - title: "Backend"
  - title: "Node"
    icon:
      name: "simple-icons:nodedotjs"
  - title: "TypeScript"
    icon:
      name: "simple-icons:typescript"
links:
  - title: "Mehr erfahren"
    url: "https://nestjs.com"
    icon:
      name: "sf-symbols:chevron.right"

i18n:
  en:
    description: >-
      I got to know this backend framework in the Apps Team and used it to
      build my CRUD app. I learned a lot about its architecture and its
      various modules. I also worked with it on production projects in the
      Apps Team, for example the Fleetmanagement Tool or the new web
      frontends.
    links:
      - title: "Learn more"
  fr:
    description: >-
      J'ai découvert ce framework backend dans l'Apps Team et je l'ai utilisé
      pour créer mon application CRUD. J'ai beaucoup appris sur son
      architecture et sur ses différents modules. Je l'ai aussi utilisé dans
      des projets en production de l'Apps Team, par exemple le Fleetmanagement
      Tool ou les nouveaux frontends web.
    links:
      - title: "En savoir plus"
  it:
    description: >-
      Ho conosciuto questo framework backend nell'Apps Team e l'ho usato per
      creare la mia applicazione CRUD. Ho imparato molto sulla sua
      architettura e sui suoi vari moduli. L'ho usato anche in progetti in
      produzione dell'Apps Team, per esempio il Fleetmanagement Tool o i
      nuovi frontend web.
    links:
      - title: "Per saperne di più"
