icon:
  name: "simple-icons:bun"
  background: "var(--color-card-logo-secondary)"
  colors:
    primary: "var(--color-card-logo-primary)"
    secondary: "var(--color-card-logo-secondary)"
    tertiary: "var(--color-card-logo-tertiary)"
eyebrow: "Runtime"
title: "Bun"
description: >-
  Ich habe Bun kennengelernt, als ich meine Webseite auf Nuxt umgestellt
  habe. Vor allem die Einfachheit und die Geschwindigkeit im Vergleich zu
  Node.js haben mich überzeugt, weswegen ich, wenn möglich, nur noch Bun
  verwende.
badges:
  - title: "Server"
  - title: "Backend"
  - title: "TypeScript"
    icon:
      name: "simple-icons:typescript"
links:
  - title: "Mehr erfahren"
    url: "https://bun.sh"
    icon:
      name: "sf-symbols:chevron.right"

i18n:
  en:
    description: >-
      I got to know Bun when I migrated my website to Nuxt. Its simplicity
      and speed compared to Node.js convinced me, which is why I now use only
      Bun whenever I can.
    links:
      - title: "Learn more"
  fr:
    description: >-
      J'ai découvert Bun lorsque j'ai migré mon site web vers Nuxt. Sa
      simplicité et sa rapidité par rapport à Node.js m'ont convaincu, c'est
      pourquoi je n'utilise plus que Bun dès que c'est possible.
    links:
      - title: "En savoir plus"
  it:
    description: >-
      Ho conosciuto Bun quando ho migrato il mio sito web a Nuxt. Mi hanno
      convinto soprattutto la semplicità e la velocità rispetto a Node.js,
      per questo ormai uso solo Bun ogni volta che è possibile.
    links:
      - title: "Per saperne di più"
