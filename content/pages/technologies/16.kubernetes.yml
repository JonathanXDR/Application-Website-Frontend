    description: >-
      I also got to know Kubernetes in vocational school module 347, where I
      used it to deploy an application with CI/CD. The ÜK 210 then gave me a
      deeper insight into container orchestration, because it covered the
      topic in more depth.
    links:
      - title: "Learn more"
  fr:
    eyebrow: "Gestion des conteneurs"
    description: >-
      J'ai également découvert Kubernetes dans le module 347 de l'école
      professionnelle, où je l'ai utilisé pour déployer une application avec
      CI/CD. Le ÜK 210 m'a ensuite donné un aperçu plus approfondi de
