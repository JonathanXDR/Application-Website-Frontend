icon:
  name: "simple-icons:kotlin"
  background: "#7F52FF"
  colors:
    primary: "#7F52FF"
    secondary: "#7F52FF"
    tertiary: "#7F52FF"
eyebrow: "Sprache"
title: "Kotlin"
description: >-
  Kotlin habe ich im ÜK 335 gelernt, wo wir als Projektarbeit eine Android
  App erstellt haben. Dabei konnten wir selbst entscheiden, ob wir Java oder
  Kotlin verwenden. Ich habe mich für Kotlin entschieden, weil ich es
  interessant fand und weil es eine moderne Programmiersprache ist.
badges:
  - title: "Mobile"
  - title: "Object-Oriented"
  - title: "Android"
    icon:
      name: "simple-icons:android"
links:
  - title: "Mehr erfahren"
    url: "https://kotlinlang.org"
    icon:
      name: "sf-symbols:chevron.right"

i18n:
  en:
    eyebrow: "Language"
    description: >-
      I learned Kotlin in the ÜK 335, where we built an Android app as our
      project work. We could decide for ourselves whether to use Java or
      Kotlin. I chose Kotlin because I found it interesting and because it is
      a modern programming language.
    links:
      - title: "Learn more"
  fr:
    eyebrow: "Langage"
    description: >-
      J'ai appris Kotlin dans le ÜK 335, où nous avons créé une application
      Android comme travail de projet. Nous pouvions choisir nous-mêmes entre
      Java et Kotlin. J'ai choisi Kotlin parce que je le trouvais intéressant
      et parce que c'est un langage de programmation moderne.
    links:
      - title: "En savoir plus"
  it:
    eyebrow: "Linguaggio"
    description: >-
      Ho imparato Kotlin nell'ÜK 335, dove abbiamo creato un'applicazione
      Android come lavoro di progetto. Potevamo scegliere noi stessi se usare
      Java o Kotlin. Ho scelto Kotlin perché lo trovavo interessante e perché
      è un linguaggio di programmazione moderno.
    links:
      - title: "Per saperne di più"
