icon:
  name: "simple-icons:typeorm"
  background: "#FE0803"
  colors:
    primary: "#FE0803"
    secondary: "#FE0803"
    tertiary: "#FE0803"
eyebrow: "ORM"
title: "TypeORM"
description: >-
  Als Alternative zu Prisma habe ich meine CRUD-App, nachdem ich sie
  fertiggestellt hatte, auch noch mit TypeORM umgesetzt, weil auch dieses ORM
  in diversen Projekten im Apps Team verwendet wird.
badges:
  - title: "Database"
  - title: "ORM"
  - title: "TypeScript"
    icon:
      name: "simple-icons:typescript"
links:
  - title: "Mehr erfahren"
    url: "https://typeorm.io"
    icon:
      name: "sf-symbols:chevron.right"

i18n:
  en:
    description: >-
      As an alternative to Prisma, I rebuilt my CRUD app with TypeORM once I
      had finished it, because this ORM is used in various projects in the
      Apps Team too.
    links:
      - title: "Learn more"
  fr:
    description: >-
      Comme alternative à Prisma, j'ai réimplémenté mon application CRUD avec
      TypeORM une fois celle-ci terminée, car cet ORM est lui aussi utilisé
      dans divers projets de l'Apps Team.
    links:
      - title: "En savoir plus"
  it:
    description: >-
      Come alternativa a Prisma, dopo aver terminato la mia applicazione CRUD
      l'ho realizzata anche con TypeORM, perché pure questo ORM è usato in
      diversi progetti dell'Apps Team.
    links:
      - title: "Per saperne di più"
