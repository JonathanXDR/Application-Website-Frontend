icon:
  name: "simple-icons:express"
  background: "var(--color-card-logo-secondary)"
  colors:
    primary: "var(--color-card-logo-primary)"
    secondary: "var(--color-card-logo-secondary)"
    tertiary: "var(--color-card-logo-tertiary)"
eyebrow: "Framework"
title: "Express.js"
description: >-
  Meine CRUD-App im NexCC habe ich damit erstellt, was sehr lehrreich für
  mich war. Später hatte ich auch noch einen entsprechenden ÜK, bei dem es
  darum ging, ein Backend mit Express.js zu erstellen.
badges:
  - title: "Web"
  - title: "Backend"
  - title: "Node"
    icon:
      name: "simple-icons:nodedotjs"
links:
  - title: "Mehr erfahren"
    url: "https://expressjs.com"
    icon:
      name: "sf-symbols:chevron.right"

i18n:
  en:
    description: >-
      I used it to build my CRUD app at NexCC, which taught me a lot. Later I
      also attended a corresponding ÜK, which was about building a backend
      with Express.js.
    links:
      - title: "Learn more"
  fr:
    description: >-
      C'est avec Express.js que j'ai créé mon application CRUD au NexCC, ce
      qui m'a beaucoup appris. Plus tard, j'ai également suivi un ÜK
      correspondant, qui portait sur la création d'un backend avec
      Express.js.
    links:
      - title: "En savoir plus"
  it:
    description: >-
      L'ho utilizzato per creare la mia applicazione CRUD al NexCC, cosa che
      mi ha insegnato molto. In seguito ho seguito anche un ÜK dedicato, che
      riguardava la creazione di un backend con Express.js.
    links:
      - title: "Per saperne di più"
