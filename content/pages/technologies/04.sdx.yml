icon:
  name: "simple-icons-extended:swisscom"
  background: "var(--color-card-logo-secondary)"
  colors:
    primary: "var(--color-card-logo-primary)"
    secondary: "var(--color-card-logo-secondary)"
    tertiary: "var(--color-card-logo-tertiary)"
eyebrow: "Bibliothek"
title: "SDX"
description: >-
  Mit der Swisscom Digital Experience (SDX) Library bin ich schon mehrmals
  während meiner Ausbildung in Kontakt gekommen. Ich habe damit z.B. beim
  Entwickeln der Apps Team Webseite, der Medienkurse und noch vielen weiteren
  Swisscom-Applikationen gearbeitet.
badges:
  - title: "Swisscom"
  - title: "Design"
  - title: "UI"
links:
  - title: "Mehr erfahren"
    url: "https://sdx.swisscom.ch"
    icon:
      name: "sf-symbols:chevron.right"

i18n:
  en:
    eyebrow: "Library"
    description: >-
      I came into contact with this library several times during my training.
      For example, I used it to develop the Apps Team website, the media
      courses and many other Swisscom applications.
    links:
      - title: "Learn more"
  fr:
    eyebrow: "Bibliothèque"
    description: >-
      J'ai déjà été en contact avec cette bibliothèque plusieurs fois pendant
      ma formation. Je l'ai utilisée par exemple pour développer les
      applications du site web de l'équipe, les cours médias et bien d'autres
      applications Swisscom.
    links:
      - title: "En savoir plus"
  it:
    eyebrow: "Biblioteca"
    description: >-
      Sono già entrato in contatto con questa libreria diverse volte durante
      la mia formazione. Ad esempio, l'ho utilizzata per sviluppare le
      applicazioni del sito web del Team, i corsi sui media e molte altre
      applicazioni di Swisscom.
    links:
      - title: "Per saperne di più"
