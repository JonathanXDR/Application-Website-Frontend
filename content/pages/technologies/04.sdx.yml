icon:
  name: "simple-icons-extended:swisscom"
  background: "var(--color-card-logo-secondary)"
  colors:
    primary: "var(--color-card-logo-primary)"
    secondary: "var(--color-card-logo-secondary)"
    tertiary: "var(--color-card-logo-tertiary)"
eyebrow: "Bibliothek"
title: "SDX"
description: >-
  Mit der Swisscom Digital Experience (SDX) Library bin ich während meiner
  Ausbildung schon mehrmals in Kontakt gekommen. Ich habe damit z.B. bei der
  Apps Team Webseite, den Medienkursen und vielen weiteren
  Swisscom-Applikationen gearbeitet.
badges:
  - title: "Swisscom"
  - title: "Design"
  - title: "UI"
links:
  - title: "Mehr erfahren"
    url: "https://sdx.swisscom.ch"
    icon:
      name: "sf-symbols:chevron.right"

i18n:
  en:
    eyebrow: "Library"
    description: >-
      I came into contact with the Swisscom Digital Experience (SDX) library
      several times during my training. I used it, for example, on the Apps
      Team website, the media courses and many other Swisscom applications.
    links:
      - title: "Learn more"
  fr:
    eyebrow: "Bibliothèque"
    description: >-
      J'ai déjà été en contact plusieurs fois avec la bibliothèque Swisscom
      Digital Experience (SDX) pendant ma formation. Je l'ai utilisée par
      exemple pour le site web de l'Apps Team, les cours médias et bien
      d'autres applications Swisscom.
    links:
      - title: "En savoir plus"
  it:
    eyebrow: "Libreria"
    description: >-
      Sono già entrato in contatto diverse volte con la libreria Swisscom
      Digital Experience (SDX) durante la mia formazione. L'ho utilizzata ad
      esempio per il sito web dell'Apps Team, i corsi sui media e molte altre
      applicazioni Swisscom.
    links:
      - title: "Per saperne di più"
