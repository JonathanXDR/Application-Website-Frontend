    description: >-
      I only learned React itself after I had already worked with Next.js, so
      the learning curve wasn't as steep. Projects where I've used React
      include the media courses, the Fleetmanagement Tool and the new web
      frontends.
    links:
      - title: "Learn more"
  fr:
    description: >-
      Je n'ai appris React lui-même qu'après avoir déjà travaillé avec
      Next.js, la courbe d'apprentissage n'était donc plus aussi raide. Parmi
      les projets pour lesquels j'ai utilisé React, il y a les cours médias,
      le Fleetmanagement Tool ou encore les nouveaux frontends web.
    links:
      - title: "En savoir plus"
  it:
    description: >-
      Ho imparato React solo dopo aver già lavorato con Next.js, quindi la
      curva di apprendimento non è stata così ripida. Tra i progetti in cui
      ho utilizzato React ci sono i corsi sui media, il Fleetmanagement Tool
      e i nuovi frontend web.
    links:
