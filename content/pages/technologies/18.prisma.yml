icon:
  name: "simple-icons:prisma"
  background: "var(--color-card-logo-secondary)"
  colors:
    primary: "var(--color-card-logo-primary)"
    secondary: "var(--color-card-logo-secondary)"
    tertiary: "var(--color-card-logo-tertiary)"
eyebrow: "ORM"
title: "Prisma"
description: >-
  Prisma habe ich verwendet, um meine CRUD-App zu erstellen, und bin dabei
  zum ersten Mal mit einem ORM in Berührung gekommen. Später habe ich auch
  beim Fleetmanagement Tool mit Prisma gearbeitet.
badges:
  - title: "Database"
  - title: "ORM"
  - title: "TypeScript"
    icon:
      name: "simple-icons:typescript"
links:
  - title: "Mehr erfahren"
    url: "https://prisma.io"
    icon:
      name: "sf-symbols:chevron.right"

i18n:
  en:
    description: >-
      I used Prisma to build my CRUD app, and it was my first contact with an
      ORM. Later I also worked with Prisma on the Fleetmanagement Tool.
    links:
      - title: "Learn more"
  fr:
    description: >-
      J'ai utilisé Prisma pour créer mon application CRUD et c'était mon
      premier contact avec un ORM. Plus tard, j'ai aussi travaillé avec
      Prisma sur le Fleetmanagement Tool.
    links:
      - title: "En savoir plus"
  it:
    description: >-
      Ho usato Prisma per creare la mia applicazione CRUD ed è stato il mio
      primo contatto con un ORM. In seguito ho lavorato con Prisma anche al
      Fleetmanagement Tool.
    links:
      - title: "Per saperne di più"
