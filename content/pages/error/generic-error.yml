pageId: generic-error
label: "Fehler"
icon:
  name: "sf-symbols:exclamationmark.octagon.fill"
  colors:
    primary: "var(--color-system-red)"
title: "Error {status}"
description: >-
  Etwas ist schiefgelaufen. Lade die Seite neu oder komm später wieder, falls
  das Problem bestehen bleibt.

i18n:
  en:
    label: "Error"
    description: >-
      Something went wrong. Reload the page or come back later if the problem
      persists.
  fr:
    label: "Erreur"
    title: "Erreur {status}"
    description: >-
      Quelque chose s'est mal passé. Recharge la page ou reviens plus tard si
      le problème persiste.
  it:
    label: "Errore"
    title: "Errore {status}"
    description: >-
      Qualcosa è andato storto. Ricarica la pagina oppure torna più tardi se
      il problema persiste.
