pageId: not-found
label: "Seite nicht gefunden"
status: 404
icon:
  name: "sf-symbols:exclamationmark.triangle.fill"
  colors:
    primary: "var(--color-fill)"
    tertiary: "var(--color-system-yellow)"
title: "{status} Nicht gefunden"
description: >-
  Die Seite, die du suchst, gibt es nicht. Überprüfe die Adresse auf
  Tippfehler oder kehre zur Startseite zurück.

i18n:
  en:
    label: "Page Not Found"
    title: "{status} Not Found"
    description: >-
      The page you are looking for doesn't exist. Check the address for typos
      or go back to the home page.
  fr:
    label: "Page non trouvée"
    title: "{status} Introuvable"
    description: >-
      La page que tu cherches n'existe pas. Vérifie que l'adresse ne contient
      pas de faute de frappe ou retourne à la page d'accueil.
  it:
    label: "Pagina non trovata"
    title: "{status} Non trovato"
    description: >-
      La pagina che cerchi non esiste. Controlla se l'indirizzo contiene
      errori di battitura oppure torna alla pagina iniziale.
