pageId: not-found
label: "Seite nicht gefunden"
status: 404
icon:
  name: "sf-symbols:exclamationmark.triangle.fill"
  colors:
    primary: "var(--color-fill)"
    tertiary: "var(--color-system-yellow)"
title: "{status} Not Found"
description: >-
  Die Seite, die du suchst, kann nicht gefunden werden. Bitte überprüfe sie
  und versuche es erneut.

i18n:
  en:
    label: "Page not found"
    description: >-
      The page you are looking for cannot be found. Please check it and try
      again.
  fr:
    label: "Page non trouvée"
    description: >-
      La page que tu cherches est introuvable. Vérifie-la s'il te plaît et
      essaie à nouveau.
  it:
    label: "Pagina non trovata"
    title: "{status} Non trovato"
    description: >-
      La pagina che stai cercando non può essere trovata. Controlla e
      riprova.
