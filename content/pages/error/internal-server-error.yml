pageId: internal-server-error
label: "Interner Serverfehler"
status: 500
icon:
  name: "sf-symbols:exclamationmark.octagon.fill"
  colors:
    primary: "var(--color-fill)"
    tertiary: "var(--color-system-red)"
title: "{status} Interner Serverfehler"
description: >-
  Auf dem Server ist etwas schiefgelaufen. Lade die Seite neu oder komm
  später wieder, falls das Problem bestehen bleibt.

i18n:
  en:
    label: "Internal Server Error"
    title: "{status} Internal Server Error"
    description: >-
      Something went wrong on the server. Reload the page or come back later
      if the problem persists.
  fr:
    label: "Erreur interne du serveur"
    title: "{status} Erreur interne du serveur"
    description: >-
      Quelque chose s'est mal passé sur le serveur. Recharge la page ou
      reviens plus tard si le problème persiste.
  it:
    label: "Errore interno del server"
    title: "{status} Errore interno del server"
    description: >-
      Qualcosa è andato storto sul server. Ricarica la pagina oppure torna
      più tardi se il problema persiste.
