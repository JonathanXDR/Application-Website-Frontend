# Scores never fail the job, because no `ci.budget` is set in
# `unlighthouse.config.ts` yet.
#
# Vercel also emits `deployment_status`, but `repository_dispatch` carries the
# deployment metadata directly.
# https://vercel.com/docs/git/vercel-for-github#repository-dispatch-events
#
# `actions/*` are pinned by major version tag and the third-party action by
# commit SHA, following GitHub's secure-use guide.
# https://docs.github.com/en/actions/reference/security/secure-use
name: Unlighthouse

on:
  repository_dispatch:
    types:
      - vercel.deployment.ready
      - vercel.deployment.success
  workflow_dispatch:
    inputs:
      site:
        description: Deployment URL to audit, for example https://dev.jonathan-russ.com
        required: true
        type: string

permissions: {}

# `shell: bash` adds `pipefail`, which the runner default does not set. The
# redaction step pipes `grep`, and a failure there must not look clean.
defaults:
  run:
    shell: bash

# `environment` alone is too coarse, because every preview deployment shares
# the value `preview`, so two branches deploying at once would cancel each
# other's audit. These payload values are unvalidated, since `concurrency` is
# evaluated before the job-level `if`, but they only name a group and never
# reach a shell.
concurrency:
  group: >-
    unlighthouse-${{ github.event.client_payload.environment || 'manual' }}-${{
    github.event.client_payload.git.ref || inputs.site || github.run_id }}
  cancel-in-progress: true

jobs:
  audit:
    # A production deployment emits `ready` when it finishes building and
    # `success` when it is promoted, so pairing each event with one environment
    # stops a double audit.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.action == 'vercel.deployment.ready' && github.event.client_payload.environment == 'preview')
      || (github.event.action == 'vercel.deployment.success' && github.event.client_payload.environment == 'production')
    runs-on: ubuntu-latest
    # Without this a hung audit would run to the 6 hour default
    timeout-minutes: 20
    permissions:
      contents: read
      # A `repository_dispatch` run stays invisible on the pull request without
      # a commit status.
      statuses: write
    steps:
      - name: Report status on the deployed commit
        if: github.event_name == 'repository_dispatch'
        uses: vercel/repository-dispatch/actions/status@30f760c6640485cd92f8c785ef361382555fb712 # v1
        with:
          name: Unlighthouse
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Ordered before the installs so a misconfigured job fails in seconds. A
      # bare host gains its scheme here, because `resolveRoutes` builds
      # `new URL('/sitemap.xml', site)`, which throws without one.
      - name: Check inputs and resolve the site
        env:
          # Read through a variable so the payload never reaches the shell as
          # template text.
          RAW_SITE: ${{ inputs.site || github.event.client_payload.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$RAW_SITE" ]; then
            echo "::error::The dispatch payload has no deployment URL in client_payload.url. Check the Vercel Git integration for this project, or run this workflow manually and pass the site URL."
            exit 1
          fi
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is not set, so the audit cannot get past Deployment Protection. Copy the bypass secret from the Vercel project (Settings > Deployment Protection) and add it to this repository as an Actions secret with the same name."
            exit 1
          fi
          case "$RAW_SITE" in
            http://*|https://*) site="$RAW_SITE" ;;
            *) site="https://$RAW_SITE" ;;
          esac
          # A dispatch payload is JSON, so the URL can carry newlines, which
          # would let it append variables to `$GITHUB_ENV` or emit workflow
          # commands into the log. The `grep` anchors are per line, so they
          # hold only because `case` matches the whole value, and the error
          # never echoes it.
          case "$site" in
            *[!A-Za-z0-9.:/-]*) shape=bad ;;
            *) shape=ok ;;
          esac
          if [ "$shape" != ok ] || ! printf '%s' "$site" | grep -Eq '^https?://[A-Za-z0-9.-]+(:[0-9]+)?/?$'; then
            echo "::error::The deployment URL is not a plain origin such as https://example.com, so it was not audited. Re-run this workflow manually and pass a plain origin as the site input."
            exit 1
          fi
          printf 'UNLIGHTHOUSE_SITE=%s\n' "$site" >> "$GITHUB_ENV"
          echo "Auditing $site"

      # A sparse checkout implies a `blob:none` partial clone, which skips the
      # rest of a 187 MiB pack.
      - name: Check out the Unlighthouse config
        uses: actions/checkout@v7
        with:
          sparse-checkout: unlighthouse.config.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Quoted so a later value such as '24.10' is not read as the number 24.1
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Pinned so scores stay comparable across runs, and kept in step with the
      # `unlighthouse` devDependency by hand, because Dependabot does not read a
      # version out of a `run` step. `puppeteer` is deliberately absent, since
      # Unlighthouse imports `puppeteer-core` and finds Chrome through
      # `chrome-launcher`, which uses the runner's preinstalled build.
      - name: Install Unlighthouse
        run: npm install --global unlighthouse@0.18.0

      - name: Audit ${{ env.UNLIGHTHOUSE_SITE }}
        run: unlighthouse-ci --build-static
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      # Lighthouse copies `extraHeaders` verbatim into the per-route reports,
      # so the bypass secret lands in them. Artifacts on a public repository are
      # downloadable by any signed-in user, and `::add-mask::` redacts logs,
      # never artifacts.
      - name: Redact the bypass secret from the report
        if: always()
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          [ -d .unlighthouse ] || exit 0
          grep -rl -- "$VERCEL_AUTOMATION_BYPASS_SECRET" .unlighthouse 2>/dev/null \
            | tr '\n' '\0' \
            | xargs -0 -r perl -pi -e 's/\Q$ENV{VERCEL_AUTOMATION_BYPASS_SECRET}\E/REDACTED/g'
          if grep -rq -- "$VERCEL_AUTOMATION_BYPASS_SECRET" .unlighthouse 2>/dev/null; then
            echo "::error::The bypass secret is still present in the report, so it was not uploaded. Rotate VERCEL_AUTOMATION_BYPASS_SECRET in the Vercel project."
            exit 1
          fi

      # A missing report only warns, so a failed audit is reported by the audit
      # step rather than by this one.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unlighthouse-${{ github.event.client_payload.environment || 'manual' }}-${{ github.run_number }}
          path: .unlighthouse
          if-no-files-found: warn
          retention-days: 14
